{% extends 'news/base.html' %}

{% load static %}

{% block title %} {{ news.title }} {% endblock title %}

{% block content %}
<div class="container" style="padding: 40px 0;">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h2 style="font-weight: 700; color: #1a1a1a; margin-top: 20px;">{{ news.title }}</h2>
            <h5 style="color: #888; font-style: italic; margin-bottom: 20px;">
                <i class="far fa-clock"></i> {{ news.published_time }}
            </h5>

            {% if news.image %}
            <img src="{{ news.image.url }}" style="width: 100%; height: 400px; object-fit: cover; border-radius: 6px; margin-bottom: 25px;">
            {% endif %}

            <p style="font-size: 1.1rem; line-height: 1.8; color: #333;">{{ news.body|linebreaks }}</p>

        </div>
    </div>
</div>

{% endblock content %}
